# P2-Detect lightweight DRF-SAFPN-YOLO11n with reg_max=12.
# Keeps P2 direct detection and uses FastSAF to reduce small dynamic fusion kernels.

nc: 1
scales:
  n: [0.50, 0.25, 1024]

backbone:
  - [-1, 1, Conv, [64, 3, 2]] # 0
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]] # 2
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]] # 4
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 2, C3k2, [512, True]] # 6
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 2, C3k2, [1024, True]] # 8
  - [-1, 1, SPPF, [1024, 5]] # 9
  - [-1, 2, C2PSA, [1024]] # 10

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]]
  - [-1, 2, C3k2, [512, False]] # 13

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]]
  - [-1, 2, C3k2, [256, False]] # 16
  - [-1, 1, LightDRF_LSK, [256]] # 17-P3 light dynamic receptive field

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 2], 1, Concat, [1]]
  - [-1, 2, C3k2, [96, False]] # 20-P2

  - [-1, 1, Conv, [128, 3, 2]]
  - [[-1, 17], 1, FastSAF, [256]] # 22
  - [-1, 2, C3k2, [256, False]] # 23-P3

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 13], 1, FastSAF, [512]] # 25
  - [-1, 2, C3k2, [512, False]] # 26-P4

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 10], 1, Concat, [1]]
  - [-1, 2, C3k2, [1024, True]] # 29-P5

  - [[20, 23, 26, 29], 1, LiteR12GCGDetect, [nc]]
