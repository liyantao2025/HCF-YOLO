# HCF-YOLO12n for cross-architecture generality validation.
# Keeps the YOLO12n A2C2f backbone and adds the three manuscript ideas:
# P2 high-resolution detection, LMSFF, and training-only GCG supervision.

nc: 1
scale: n
scales:
  n: [0.50, 0.25, 1024]

backbone:
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]] # 2-P2 feature
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]] # 4-P3 feature
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 4, A2C2f, [512, True, 4]] # 6-P4 feature
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 4, A2C2f, [1024, True, 1]] # 8-P5 feature

head:
  # YOLO12 top-down semantic path.
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 9
  - [[-1, 6], 1, Concat, [1]] # 10
  - [-1, 2, A2C2f, [512, False, -1]] # 11-P4 top-down

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 12
  - [[-1, 4], 1, Concat, [1]] # 13
  - [-1, 2, A2C2f, [256, False, -1]] # 14-P3 top-down

  # LMSFF: receptive-field selection at P3 followed by a P2 detail path.
  - [-1, 1, LightDRF_LSK, [256]] # 15-P3 enhanced
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 16
  - [[-1, 2], 1, Concat, [1]] # 17 fuse backbone P2
  - [-1, 2, C3k2, [96, False]] # 18-P2 detection feature

  # LMSFF lightweight bottom-up aggregation.
  - [-1, 1, Conv, [128, 3, 2]] # 19
  - [[-1, 15], 1, FastSAF, [256]] # 20
  - [-1, 2, LiteC3k2, [256, False]] # 21-P3 detection feature

  - [-1, 1, Conv, [256, 3, 2]] # 22
  - [[-1, 11], 1, FastSAF, [512]] # 23
  - [-1, 2, C3k2, [512, False]] # 24-P4 detection feature

  - [-1, 1, Conv, [512, 3, 2]] # 25
  - [[-1, 8], 1, Concat, [1]] # 26
  - [-1, 2, C3k2, [1024, True]] # 27-P5 detection feature

  # GCG is active only during training; the exported inference graph uses four detection scales.
  - [[18, 21, 24, 27], 1, SharedLiteR12GCGDetect, [nc]] # 28 Detect(P2, P3, P4, P5)

