# P2Direct + SemiSlimNeck: restore stronger P4/P5 fusion while keeping high-res paths light.

nc: 1
scales:
  n: [0.50, 0.25, 1024]

backbone:
  - [-1, 1, Conv, [64, 3, 2]]
  - [-1, 1, Conv, [128, 3, 2]]
  - [-1, 2, C3k2, [256, False, 0.25]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [-1, 2, C3k2, [512, False, 0.25]]
  - [-1, 1, Conv, [512, 3, 2]]
  - [-1, 2, C3k2, [512, True]]
  - [-1, 1, Conv, [1024, 3, 2]]
  - [-1, 2, C3k2, [1024, True]]
  - [-1, 1, SPPF, [1024, 5]]
  - [-1, 2, C2PSA, [1024]]

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]]
  - [-1, 2, C3k2, [512, False]] # 13-P4 strong top-down fusion

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]]
  - [-1, 2, LiteC3k2, [256, False]] # 16-P3 semi-light high-res fusion
  - [-1, 1, LightDRF_LSK, [256]] # 17-P3 dynamic receptive field

  - [2, 1, Conv, [96, 1, 1]] # 18-P2 direct

  - [-1, 1, Conv, [128, 3, 2]]
  - [[-1, 17], 1, FastSAF, [256]]
  - [-1, 2, LiteC3k2, [256, False]] # 21-P3 light bottom-up fusion

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 13], 1, FastSAF, [512]]
  - [-1, 2, C3k2, [512, False]] # 24-P4 strong bottom-up fusion

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 10], 1, Concat, [1]]
  - [-1, 2, C3k2, [1024, True]] # 27-P5 strong final fusion

  - [[18, 21, 24, 27], 1, SharedLiteR12GCGDetect, [nc]]
