# P2Direct Balance P2SG v1.
# Based on BalancedNeck-C: keep P2 direct and add a tiny P3-guided P2 semantic gate.

nc: 1
scales:
  n: [0.50, 0.25, 1024]

backbone:
  - [-1, 1, Conv, [64, 3, 2]]
  - [-1, 1, Conv, [128, 3, 2]]
  - [-1, 2, C3k2, [256, False, 0.25]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [-1, 2, C3k2, [512, False, 0.25]]
  - [-1, 1, Conv, [512, 3, 2]]
  - [-1, 2, C3k2, [512, True]]
  - [-1, 1, Conv, [1024, 3, 2]]
  - [-1, 2, C3k2, [1024, True]]
  - [-1, 1, SPPF, [1024, 5]]
  - [-1, 2, C2PSA, [1024]]

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]]
  - [-1, 2, LiteC3k2, [512, False]] # 13

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]]
  - [-1, 2, LiteC3k2, [352, False]] # 16-P3 widened
  - [-1, 1, LightDRF_LSK, [352]] # 17

  - [2, 1, Conv, [96, 1, 1]] # 18-P2 direct
  - [[18, 17], 1, P2SemanticGate, [96]] # 19-P2 guided by P3 semantics

  - [-1, 1, Conv, [176, 3, 2]]
  - [[-1, 17], 1, FastSAF, [352]]
  - [-1, 2, LiteC3k2, [352, False]] # 22

  - [-1, 1, Conv, [352, 3, 2]]
  - [[-1, 13], 1, FastSAF, [704]]
  - [-1, 2, LiteC3k2, [704, False]] # 25

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 10], 1, Concat, [1]]
  - [-1, 2, C3k2, [1024, True]] # 28-P5 strong final fusion

  - [[19, 22, 25, 28], 1, SharedLiteR12GCGDetect, [nc]]
