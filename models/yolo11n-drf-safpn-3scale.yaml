# DRF-SAFPN 三尺度（P3/P4/P5）：无 P2 检测层，Neck 中 Concat 替换为 SAF + DRF-LSK
# 消融因子 B（A× B√ C×）：drf_safpn

nc: 1
scales:
  n: [0.50, 0.25, 1024]

backbone:
  - [-1, 1, Conv, [64, 3, 2]] # 0
  - [-1, 1, Conv, [128, 3, 2]] # 1
  - [-1, 2, C3k2, [256, False, 0.25]] # 2
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]] # 4
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 2, C3k2, [512, True]] # 6
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 2, C3k2, [1024, True]] # 8
  - [-1, 1, SPPF, [1024, 5]] # 9
  - [-1, 2, C2PSA, [1024]] # 10

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]]
  - [-1, 2, C3k2, [512, False]] # 13

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]]
  - [-1, 2, C3k2, [256, False]] # 16-P3
  - [-1, 1, DRF_LSK, [256]] # 17 DRF-LSK on P3

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 17], 1, SAF, [256]] # 19 SAF fuse P3
  - [-1, 2, C3k2, [256, False]] # 20-P3 out

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 13], 1, SAF, [512]] # 22 SAF fuse P4
  - [-1, 2, C3k2, [512, False]] # 23-P4 out

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 10], 1, Concat, [1]]
  - [-1, 2, C3k2, [1024, True]] # 26-P5 out

  - [[20, 23, 26], 1, Detect, [nc]]
