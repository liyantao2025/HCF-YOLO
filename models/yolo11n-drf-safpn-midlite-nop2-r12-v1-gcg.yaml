# MidLite no-P2 R12 v1 + GCG.
# Ablation G: YOLOv11n + improved multi-scale fusion structure + GCG + SA-WIoU v3.
# SA-WIoU v3 is selected by the training argument --box_loss sa_wiou_v3.

nc: 1
scales:
  n: [0.50, 0.25, 1024]

backbone:
  - [-1, 1, Conv, [64, 3, 2]] # 0
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]] # 2
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]] # 4
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 2, C3k2, [512, True]] # 6
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 2, C3k2, [1024, True]] # 8
  - [-1, 1, SPPF, [1024, 5]] # 9
  - [-1, 2, C2PSA, [1024]] # 10

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]]
  - [-1, 2, C3k2, [512, False]] # 13-P4 top-down

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]]
  - [-1, 2, C3k2, [256, False]] # 16-P3 top-down
  - [-1, 1, LightDRF_LSK, [256]] # 17-P3 dynamic receptive field

  - [[-1, 16], 1, FastSAF, [256]] # 18-P3 self/adaptive fusion without P2 output
  - [-1, 2, LiteC3k2, [256, False]] # 19-P3 midlite fusion

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 13], 1, FastSAF, [512]] # 21-P4 scale-adaptive fusion
  - [-1, 2, C3k2, [512, False]] # 22-P4

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 10], 1, Concat, [1]]
  - [-1, 2, C3k2, [1024, True]] # 25-P5

  - [[19, 22, 25], 1, SharedLiteR12GCGDetect, [nc]]
