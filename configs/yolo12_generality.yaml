# Cross-architecture generality experiment requested during Sensors editorial pre-check.
# Both variants are trained from YAML with identical data and hyperparameters.

init_mode: random
pretrained: false
resume: false
exist_ok: false
seed: 42
pretrained_weights: null

data: data.yaml
project: runs/generality/yolo12
eval_split: test

imgsz: 640
batch: 16
epochs: 200
optimizer: Adam
lr0: 0.001
lrf: 0.01
weight_decay: 0.0005
warmup_epochs: 3.0
patience: 300

device: "0"
workers: 8

amp: true
deterministic: true
val: true
plots: true
verbose: true

max_det: 1000
val_conf: 0.001
val_iou: 0.7
val_max_det: 1000

predict_conf: 0.15
predict_iou: 0.5
predict_max_det: 1000

center_gain: 0.1

# Keep the manuscript augmentation protocol unchanged.
mosaic: 0.5
close_mosaic: 20
mixup: 0.0
cutmix: 0.0
copy_paste: 0.0
hsv_h: 0.015
hsv_s: 0.5
hsv_v: 0.3
degrees: 0.0
translate: 0.08
scale: 0.2
shear: 0.0
perspective: 0.0
fliplr: 0.5
flipud: 0.0
auto_augment: null
erasing: 0.0

experiments:
  yolo12n_baseline:
    name: yolo12n_baseline
    desc: "YOLO12n"
    model: models/generality/yolo12n.yaml
    box_loss_type: ciou
    use_center_guidance: false
    p2: false
    drf_safpn: false
    sa_wiou_gcg: false

  hcf_yolo12n:
    name: hcf_yolo12n
    desc: "HCF-YOLO12n (P2 + LMSFF + GCG)"
    model: models/generality/hcf-yolo12n.yaml
    box_loss_type: sa_wiou_v3
    use_center_guidance: true
    center_gain: 0.1
    p2: true
    drf_safpn: true
    sa_wiou_gcg: true

