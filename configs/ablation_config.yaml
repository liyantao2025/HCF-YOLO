# DRF-SAFPN-YOLO 2^3 全因子消融实验（高密度棉苗小目标检测）
# 因子 A：P2 高分辨率检测层 | B：DRF-SAFPN | C：SA-WIoU v3 + GCG

init_mode: random
pretrained: false
resume: false
exist_ok: false
seed: 42
pretrained_weights: null

data: data.yaml
project: runs/ablation

imgsz: 640
batch: 16
epochs: 200
optimizer: Adam
lr0: 0.001
lrf: 0.01
weight_decay: 0.0005
warmup_epochs: 3.0
patience: 300

device: "0"
workers: 8

amp: true
deterministic: true
val: true
plots: true
verbose: true

max_det: 1000
val_conf: 0.001
val_iou: 0.7
val_max_det: 1000

predict_conf: 0.15
predict_iou: 0.5
predict_max_det: 1000

center_gain: 0.1

# 八组消融完全一致的数据增强
mosaic: 0.5
close_mosaic: 20
mixup: 0.0
cutmix: 0.0
copy_paste: 0.0

hsv_h: 0.015
hsv_s: 0.5
hsv_v: 0.3

degrees: 0.0
translate: 0.08
scale: 0.2
shear: 0.0
perspective: 0.0

fliplr: 0.5
flipud: 0.0
auto_augment: null
erasing: 0.0

experiments:
  ablation_A_yolo11n:
    name: ablation_A_yolo11n_pretrained_samehyp
    desc: "A: YOLOv11n baseline"
    model: models/yolo11n.yaml
    box_loss_type: ciou
    use_center_guidance: false
    p2: false
    lightdrf_lsk: false
    drf_safpn: false
    sa_wiou_gcg: false

  ablation_B_yolo11n_p2:
    name: ablation_B_yolo11n_p2_pretrained_samehyp
    desc: "B: YOLOv11n + P2"
    model: models/yolo11n-p2.yaml
    box_loss_type: ciou
    use_center_guidance: false
    p2: true
    lightdrf_lsk: false
    drf_safpn: false
    sa_wiou_gcg: false

  ablation_C_midlite_nop2:
    name: ablation_C_midlite_nop2_pretrained_samehyp
    desc: "C: YOLOv11n + improved multi-scale fusion structure without P2"
    model: models/yolo11n-drf-safpn-midlite-nop2-r12-v1.yaml
    box_loss_type: ciou
    use_center_guidance: false
    p2: false
    improved_fusion: true
    drf_safpn: true
    sa_wiou_gcg: false

  ablation_D_yolo11n_gcg_sawiou:
    name: ablation_D_yolo11n_gcg_sawiou_pretrained_samehyp
    desc: "D: YOLOv11n + GCG + SA-WIoU v3"
    model: models/yolo11n-gcg.yaml
    box_loss_type: sa_wiou_v3
    use_center_guidance: true
    p2: false
    lightdrf_lsk: false
    drf_safpn: false
    sa_wiou_gcg: true

  ablation_E_midlite_p2safe:
    name: ablation_E_midlite_p2safe_pretrained_samehyp
    desc: "E: YOLOv11n + P2 + improved multi-scale fusion structure"
    model: models/yolo11n-drf-safpn-midlite-p2safe-r12-v1.yaml
    box_loss_type: ciou
    use_center_guidance: false
    p2: true
    improved_fusion: true
    drf_safpn: true
    sa_wiou_gcg: false

  ablation_F_yolo11n_p2_gcg_sawiou:
    name: ablation_F_yolo11n_p2_gcg_sawiou_pretrained_samehyp
    desc: "F: YOLOv11n + P2 + GCG + SA-WIoU v3"
    model: models/yolo11n-p2-gcg.yaml
    box_loss_type: sa_wiou_v3
    use_center_guidance: true
    p2: true
    lightdrf_lsk: false
    drf_safpn: false
    sa_wiou_gcg: true

  ablation_G_midlite_nop2_gcg_sawiou:
    name: ablation_G_midlite_nop2_gcg_sawiou_pretrained_samehyp
    desc: "G: YOLOv11n + improved multi-scale fusion structure + GCG + SA-WIoU v3"
    model: models/yolo11n-drf-safpn-midlite-nop2-r12-v1-gcg.yaml
    box_loss_type: sa_wiou_v3
    use_center_guidance: true
    p2: false
    improved_fusion: true
    drf_safpn: true
    sa_wiou_gcg: true

  ablation_H_midlite_p2safe_gcg_sawiou:
    name: ablation_H_midlite_p2safe_gcg_sawiou_pretrained_samehyp
    desc: "H: YOLOv11n + P2 + improved multi-scale fusion structure + GCG + SA-WIoU v3"
    model: models/yolo11n-drf-safpn-midlite-p2safe-r12-v1-gcg.yaml
