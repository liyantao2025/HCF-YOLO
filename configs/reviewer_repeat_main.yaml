# Round-1 reviewer response: repeated main experiments with multiple random seeds.
# Both models are trained from scratch under the same protocol.

seeds: [42, 3407, 2026]

init_mode: random
pretrained: false
resume: false
pretrained_weights: null

data: data.yaml
project: runs/reviewer_repeat_main
eval_split: test

imgsz: 640
batch: 16
epochs: 200
optimizer: Adam
lr0: 0.001
lrf: 0.01
momentum: 0.937
weight_decay: 0.0005
warmup_epochs: 3.0
warmup_momentum: 0.8
warmup_bias_lr: 0.1
patience: 300

box: 7.5
cls: 0.5
dfl: 1.5

device: "0"
workers: 8
amp: true
deterministic: true
val: true
plots: true
verbose: true

max_det: 1000
val_conf: 0.001
val_iou: 0.7

mosaic: 0.5
close_mosaic: 20
mixup: 0.0
cutmix: 0.0
copy_paste: 0.0
hsv_h: 0.015
hsv_s: 0.5
hsv_v: 0.3
degrees: 0.0
translate: 0.08
scale: 0.2
shear: 0.0
perspective: 0.0
fliplr: 0.5
flipud: 0.0
auto_augment: null
erasing: 0.0

center_gain: 0.1

models:
  yolo11n:
    display_name: YOLO11n
    model: models/yolo11n.yaml
    box_loss_type: ciou
    use_center_guidance: false

  hcf_yolo11n:
    display_name: HCF-YOLO11n
    model: models/yolo11n-drf-safpn.yaml
    box_loss_type: sa_wiou_v3
    use_center_guidance: true

