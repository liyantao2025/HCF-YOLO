method: post_training_static_quantization
backend: TensorRT
precision: INT8
weights_precision: INT8
activations_precision: INT8
unsupported_operator_fallback: FP32
source_checkpoint: runs/prune/classic_bn_gamma_final_EGCG_ratio005/weights/best.pt
calibration:
  data: data.yaml
  split_source: train
  images: 320
  fraction: 1.0
evaluation:
  split: test
  images: 10
  input_size: [640, 640]
  batch_size: 1
  confidence_threshold: 0.001
  nms_iou_threshold: 0.70
  max_detections: 1000
export:
  static_shape: true
  workspace_gib: 4.0
  device: 0
note: Metrics, engine sizes, logs, hashes, and environment versions must be regenerated on the target TensorRT server.
